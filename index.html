<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mattenzeit</title>
<meta name="description" content="Heimtraining mit Matte und Eigengewicht: Trainingsvorschläge, Sprachansagen, Feedback pro Übung.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mattenzeit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
/* Layout: one phone-width app column, tab bar fixed at the bottom; onboarding, test and workout screens take over the full column. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#16201C; --muted:#5A6964; --line:#D9E0DD;
  --accent:#2346C9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB; --mat:#C9D6CF;
  --good:#1D8A5A; --warn:#B7791F; --bad:#C2413A;
  --p-squat:#2E86D6; --p-lunge:#129488; --p-hinge:#D9771E; --p-push:#D2455A;
  --p-pull:#8A4FD6; --p-core:#A08512; --p-mobility:#5E7A70; --p-cardio:#C2418F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#171F1C; --surface-2:#1D2622; --ink:#E6EDEA; --muted:#93A39D; --line:#2A3531;
  --accent:#7F98FF; --accent-ink:#0E1412; --accent-soft:#222C4A; --mat:#2C3A34;
  --good:#4CC28A; --warn:#E0A84E; --bad:#F07870;
  --p-squat:#6FB1EE; --p-lunge:#3FC2B4; --p-hinge:#F0A05A; --p-push:#F07A8B;
  --p-pull:#B58CF0; --p-core:#D6BC45; --p-mobility:#95B0A6; --p-cardio:#E77DBE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1C; --surface-2:#1D2622; --ink:#E6EDEA; --muted:#93A39D; --line:#2A3531;
  --accent:#7F98FF; --accent-ink:#0E1412; --accent-soft:#222C4A; --mat:#2C3A34;
  --good:#4CC28A; --warn:#E0A84E; --bad:#F07870;
  --p-squat:#6FB1EE; --p-lunge:#3FC2B4; --p-hinge:#F0A05A; --p-push:#F07A8B;
  --p-pull:#B58CF0; --p-core:#D6BC45; --p-mobility:#95B0A6; --p-cardio:#E77DBE;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
img{max-width:100%}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);width:min(488px,calc(100% - 32px))}
.update button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 12px;font-weight:600;white-space:nowrap}
textarea{font:inherit;font-size:.85rem;width:100%;min-height:110px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.005em}
h1{font-size:2.4rem}
h2{font-size:1.55rem}
h3{font-size:1.25rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

.btn{border-radius:12px;padding:14px 18px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.block{width:100%}
.btn.big{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em;padding:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
.btn:disabled{opacity:.45;cursor:default}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.9rem;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.rate button[aria-pressed="true"][data-v="easy"]{color:var(--good)}
.seg.rate button[aria-pressed="true"][data-v="hard"]{color:var(--warn)}
.seg.rate button[aria-pressed="true"][data-v="fail"]{color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.875rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.toggle-pain[aria-pressed="true"]{background:transparent;border-color:var(--bad);color:var(--bad)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.tag.learning{background:var(--accent-soft);color:var(--accent)}
.tag.known{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pat{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.pat i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* figure */
svg.fig{display:block;width:100%;height:auto;color:var(--ink)}
svg.fig .mat{fill:var(--mat)}
svg.fig .near,svg.fig .far{fill:none;stroke:currentColor;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
svg.fig .far{opacity:.38}
svg.fig.front .far{opacity:1}
svg.fig .head{fill:currentColor}
svg.fig .prop{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
svg.fig .kb{fill:var(--p-hinge);stroke:none}
svg.fig .kbh{fill:none;stroke:var(--p-hinge);stroke-width:2.4}
svg.fig .band{fill:none;stroke:var(--p-pull);stroke-width:2;stroke-dasharray:3 2}
.thumb{width:64px;flex:none;background:var(--surface-2);border-radius:10px;padding:4px}
.stage{background:var(--surface-2);border-radius:var(--r);padding:10px 14px 6px}

.plan-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.plan-row:first-child{border-top:0}
.dose{font-family:var(--f-display);font-weight:700;font-size:1.25rem;white-space:nowrap}
.hold{font-size:.8rem;color:var(--muted);font-weight:500}

.bal{display:grid;grid-template-columns:96px 1fr 44px;gap:8px 10px;align-items:center;font-size:.875rem}
.bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;border-radius:6px}

.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.why{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.92rem}
.weight{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}

#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
#nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent)}

/* player */
.player{min-height:calc(100vh - 60px);display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:3px}
.prog span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog span.done{background:var(--accent)}
.prog span.cur{background:var(--ink)}
.clock{font-family:var(--f-display);font-weight:700;font-size:5.2rem;line-height:.95;font-variant-numeric:tabular-nums;text-align:center}
.target{text-align:center}
.target .n{font-family:var(--f-display);font-weight:700;font-size:5.2rem;line-height:.95;font-variant-numeric:tabular-nums}
.cue{font-size:1.15rem;text-align:center;min-height:3.2em;text-wrap:balance}
.phase-rest .clock{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.875rem}
.tapzone{display:flex;flex-direction:column;gap:12px;width:100%;background:transparent;border:2px dashed var(--line);border-radius:18px;padding:12px;text-align:center}
.tapzone:active{background:var(--accent-soft)}
.taphint{font-size:.85rem;color:var(--muted);font-weight:600}
.rh{font-family:var(--f-display);font-weight:700;font-size:2.4rem;text-align:center;color:var(--accent);min-height:1.1em}
.setup{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}

.sheet-back{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
ul.clean{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
ul.clean.x li::marker{content:"✕  ";color:var(--bad)}
ul.clean.ok li::marker{content:"✓  ";color:var(--good)}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lib button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.lib .fig-wrap{background:var(--surface-2);border-radius:10px;padding:4px 6px}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--muted)}
.chart .c span.b{width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.change{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.change:first-child{border-top:0}
.change b{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.health{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.health div{background:var(--surface-2);border-radius:10px;padding:10px;font-size:.875rem}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.field input[type=text],.field input[type=number]{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
details{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9rem}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details p{margin-top:6px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.8rem;font-weight:600}
.stepper .val{font-family:var(--f-display);font-weight:700;font-size:4.4rem;min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums}
table.res{width:100%;border-collapse:collapse;font-size:.92rem}
table.res td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
table.res tr:first-child td{border-top:0}
table.res td.v{font-family:var(--f-display);font-weight:700;font-size:1.2rem;white-space:nowrap;padding-right:14px;width:1%}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script src="vendor/NoSleep.min.js" defer></script>
</head>
<body>
<div id="app"></div>
<div id="update" class="update" hidden role="status"><span class="grow small">Neue Version verfügbar.</span><button id="update-btn">Neu laden</button></div>
<nav id="nav" aria-label="Bereiche"><div class="in">
  <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-act="tab" data-v="library"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v6M8 21l4-7 4 7M6 11h12"/></svg>Übungen</button>
  <button data-act="tab" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Verlauf</button>
  <button data-act="tab" data-v="gear"><svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="6"/><path d="M8.5 10.5C8 6 9.5 4 12 4s4 2 3.5 6.5"/></svg>Geräte</button>
</div></nav>

<script>
/* ---------- Übungsdaten ---------- */
const PAT = {
  squat:{n:'Kniebeuge'}, lunge:{n:'Einbeinig'}, hinge:{n:'Hüftbeuge'}, push:{n:'Drücken'},
  pull:{n:'Ziehen'}, core:{n:'Rumpf'}, mobility:{n:'Mobilität'}, cardio:{n:'Kondition'}
};
const MAIN = ['squat','lunge','hinge','push','pull','core'];
const ORDER = ['squat','push','hinge','pull','lunge','core'];
const PRIO = ['pull','hinge','core','lunge','squat','push'];
const TARGET = {squat:6,lunge:4,hinge:6,push:6,pull:6,core:6};
const CHAINS = {squat:['squat','goblet'],lunge:['lunge','bss'],hinge:['bridge','goodmorning','swing'],
  push:['kneepush','pushup'],pull:['superman','bandrow','tablerow'],core:['deadbug','plank','sideplank']};
const EQN = {kb:'Kettlebell',band:'Widerstandsband',chair:'Stuhl oder Sofa',table:'Stabiler Tisch'};
const EQSAY = {kb:'Kettlebell bereitstellen.',band:'Band bereitlegen.',chair:'Stuhl hinter dich stellen.',table:'Zum Tisch.'};
const POSSAY = {stand:'Steh auf.',back:'Leg dich auf den Rücken.',prone:'Leg dich auf den Bauch.',quad:'Geh in den Vierfüßlerstand.',floor:'Runter auf die Matte.',side:'Leg dich auf die Seite.'};
const GOALS = {fitter:'Allgemein fitter',kraft:'Mehr Kraft',beweglich:'Beweglicher',ruecken:'Rücken stärken',abnehmen:'Abnehmen'};
const LIMITS = {knee:'Knie',back:'Rücken',shoulder:'Schulter'};
const AVOID = {knee:['lunge','bss','jack'],back:['goodmorning','swing'],shoulder:['pushup','tablerow']};
const ST = [[60,16],[60,27],[60,57],[61,78],[62,99],[59,78],[58,99],[61,42],[62,56],[59,42],[58,56]];

const EX = {
 catcow:{n:'Katze-Kuh',p:'mobility',pos:'quad',u:'reps',start:8,step:0,max:8,per:4200,key:1,
  setup:'Hände unter den Schultern, Knie unter der Hüfte.',
  cues:['Hände unter den Schultern, Knie unter der Hüfte','Einatmen: Bauch sinkt, Blick nach vorn','Ausatmen: Rücken rund machen, Kinn zur Brust'],
  bad:['Bewegung nur im Nacken','Zu schnell, ohne Atmung'],
  poses:[[[91,62],[82,72],[46,72],[46,99],[26,99],[44,99],[24,99],[82,86],[82,99],[81,86],[81,99],[64,82]],
         [[87,82],[82,74],[46,74],[46,99],[26,99],[44,99],[24,99],[82,87],[82,99],[81,87],[81,99],[64,60]]]},
 wgs:{n:'Weltbeste Dehnung',p:'mobility',pos:'stand',u:'reps',sides:1,start:4,step:0,max:4,per:3600,key:2,
  setup:'Stell dich ans hintere Ende der Matte.',
  cues:['Großer Ausfallschritt, Hände innen neben den vorderen Fuß','Ellbogen Richtung Fußknöchel sinken lassen','Arm zur Decke aufdrehen, Blick folgt der Hand'],
  bad:['Hinteres Knie kippt ein','Nur der Arm dreht, der Oberkörper nicht'],
  poses:[[[85,62],[76,66],[54,82],[74,80],[78,99],[38,92],[20,98],[75,82],[72,99],[74,82],[71,99]],
         [[83,58],[76,66],[54,82],[74,80],[78,99],[38,92],[20,98],[75,82],[72,99],[76,50],[76,34]]]},
 squat:{n:'Kniebeuge',p:'squat',pos:'stand',u:'reps',start:12,step:2,max:25,per:2600,key:1,
  setup:'Füße schulterbreit, Zehen leicht nach außen.',
  cues:['Füße schulterbreit, Zehen leicht nach außen','Hüfte nach hinten unten, als ob du dich setzt','Knie zeigen in Richtung Zehen, Fersen bleiben am Boden'],
  bad:['Knie fallen nach innen','Fersen heben ab','Rücken rundet sich unten'],
  poses:[[[60,16],[60,27],[60,57],[62,78],[62,99],[60,78],[60,99],[64,40],[70,48],[62,40],[68,48]],
         [[68,37],[63,47],[46,73],[68,76],[62,99],[66,77],[60,99],[76,50],[88,50],[74,51],[86,51]]]},
 goblet:{n:'Goblet Squat',p:'squat',pos:'stand',u:'reps',eq:['kb'],kb:1,start:10,step:2,max:20,per:2800,key:2,
  setup:'Kettlebell an den Griffseiten vor die Brust nehmen, Füße schulterbreit.',
  cues:['Kettlebell an den Griffseiten vor der Brust halten','Ellbogen zeigen nach unten, zwischen die Knie','Oberkörper aufrecht, tief und kontrolliert'],
  bad:['Gewicht rutscht von der Brust weg','Oberkörper kippt nach vorn'],
  poses:[[[60,16],[60,27],[60,57],[62,78],[62,99],[60,78],[60,99],[67,40],[67,32],[65,40],[65,32]],
         [[64,40],[62,51],[47,76],[68,78],[62,99],[66,79],[60,99],[70,62],[70,54],[68,62],[68,54]]]},

const APP_VERSION='3a.1';
const KEY='mattenzeit-v1';
const DAY=864e5;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function freshState(){return {v:2,onboarded:false,example:false,voice:true,timeCalls:true,rhythm:true,energy:'normal',
  profile:{chair:true,table:true,band:false,kb:[],pullup:false,quiet:true},
  body:{name:'',goals:['fitter'],freq:3,height:null,age:null,limits:[],measures:[]},
  levels:{squat:0,lunge:0,hinge:0,push:0,pull:0,core:0},ex:{},sessions:[],tests:[],dismissed:{},flags:{}};}
function seedState(){
  const s=freshState(); s.example=true; s.onboarded=true; s.levels.push=1;
  const now=Date.now(); const days=[27,25,23,20,18,16,13,11,9,6,4,2];
  days.forEach((d,i)=>{
    const sq=14+Math.round(i*0.55), pu=8+Math.round(i*0.4);const t=now-d*DAY+7*3600e3;
    s.sessions.push({id:uid(),ts:t,date:new Date(t).toISOString(),min:5,rpe:6,example:true,
      items:[{id:'squat',sets:2,dose:sq,rating:'ok'},{id:'pushup',sets:2,dose:pu,rating:'ok'}]});
  });
  s.ex.squat={status:'known',dose:20,clear:3,ts:now}; s.ex.pushup={status:'known',dose:12,clear:3,ts:now};
  return s;
}
function migrate(s){
  if(s.v===1){const f=freshState();
    s=Object.assign(f,s,{v:2,onboarded:false,timeCalls:true,rhythm:true,body:f.body,tests:[]});
    s.sessions.forEach(x=>{x.id=x.id||uid();x.ts=x.ts||new Date(x.date).getTime();});}
  return s;
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&(s.v===1||s.v===2))return migrate(s);}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=load()||freshState();

function exState(id){const e=EX[id];return state.ex[id]||{status:'new',dose:e.start,clear:0,hold:e.hold?e.hold.start:0};}
function setEx(id,patch){state.ex[id]=Object.assign({},exState(id),patch,{ts:Date.now()});}
function holdOf(id){const e=EX[id];if(!e.hold)return 0;const h=exState(id).hold;return h||e.hold.start;}
function available(id){return (EX[id].eq||[]).every(e=>e==='kb'?state.profile.kb.length>0:!!state.profile[e]);}
function avoided(id){return (state.body.limits||[]).some(l=>(AVOID[l]||[]).includes(id));}
function allowed(id){return !(state.profile.quiet&&EX[id].jump)&&!avoided(id);}
function since(days){return Date.now()-days*DAY;}
function setsByPattern(from){
  const o={};Object.keys(PAT).forEach(k=>o[k]=0);
  state.sessions.forEach(s=>{if(new Date(s.date).getTime()>=from)s.items.forEach(it=>{const e=EX[it.id];if(e)o[e.p]+=it.sets||1;});});
  return o;
}
function goals(){const b=state.body;if(Array.isArray(b.goals)&&b.goals.length)return b.goals;return [b.goal||'fitter'];}
function hasGoal(k){return goals().includes(k);}
function targets(){const f=(state.body.freq||3)/3;const t={};MAIN.forEach(p=>t[p]=Math.max(2,Math.round(TARGET[p]*f)));
  const g=goals();const w=k=>g[0]===k?1:g.includes(k)?.5:0;
  if(w('ruecken')){const a=Math.round(2*w('ruecken'))||1;t.pull+=a;t.hinge+=a;t.core+=a;}
  if(w('kraft')){const a=Math.round(2*w('kraft'))||1;t.squat+=a;t.push+=a;t.pull+=a;}
  return t;}

/* ---------- Trainingsvorschlag ---------- */
function pickEx(p){
  const ch=CHAINS[p];const lvl=Math.min(state.levels[p]||0,ch.length-1);
  for(let i=lvl;i>=0;i--){if(available(ch[i])&&allowed(ch[i]))return ch[i];}
  return null;
}
function buildPlan(minutes){
  const cfg={7:{n:3,rounds:2},15:{n:5,rounds:2},25:{n:6,rounds:3}}[minutes];
  let rounds=cfg.rounds; let factor=1;
  if(state.energy==='tired'){rounds=Math.max(1,rounds-1);factor=.8;}
  if(state.energy==='fit'){factor=1.1;}
  const s7=setsByPattern(since(7));const T=targets();
  const pats=MAIN.slice().sort((a,b)=>(s7[a]/T[a])-(s7[b]/T[b])||PRIO.indexOf(a)-PRIO.indexOf(b));
  const knownCount=Object.keys(state.ex).filter(k=>state.ex[k].status!=='new'&&EX[k]&&MAIN.includes(EX[k].p)).length;
  const newLimit=knownCount>=2?2:4;
  const chosen=[];let nNew=0;const skipped=[];
  for(const p of pats){
    if(chosen.length>=cfg.n)break;
    const id=pickEx(p);if(!id){if(CHAINS[p].some(avoided))skipped.push(PAT[p].n);continue;}
    const isNew=exState(id).status==='new';
    if(isNew&&nNew>=newLimit)continue;
    if(isNew)nNew++;
    chosen.push({p,id});
  }
  chosen.sort((a,b)=>ORDER.indexOf(a.p)-ORDER.indexOf(b.p));
  const items=chosen.map(c=>{const st=exState(c.id);const e=EX[c.id];
    let dose=Math.round(st.dose*factor);if(e.u==='sec')dose=Math.round(dose/5)*5;
    return {id:c.id,dose,sets:rounds,learn:st.status!=='known',hold:holdOf(c.id)};});
  const warmup=state.profile.band&&state.sessions.length%3===2?'pullapart':(state.sessions.length%2?'wgs':'catcow');
  let finisher=null;
  if(minutes===25||(minutes===15&&hasGoal('abnehmen')))finisher=state.profile.quiet?'climber':(state.sessions.length%2?'jack':'climber');
  if(finisher&&!allowed(finisher))finisher=allowed('climber')?'climber':null;
  const cooldown=(hasGoal('beweglich')||state.flags.mobility)?(warmup==='wgs'?'catcow':'wgs'):null;
  const plan={minutes,rounds,items,warmup,finisher,cooldown,newLimit,factor,skipped};
  plan.est=estMin(plan);
  return plan;
}
function estMin(plan){return Math.max(1,Math.round(stepsOf(plan).reduce((a,s)=>a+stepTime(s)+s.rest,0)/60));}
function learnDose(e,d){return e.u==='sec'?Math.max(10,Math.round(d*.6/5)*5):Math.max(3,Math.round(d*.6));}
function stepsOf(plan){
  const out=[];
  if(plan.warmup)out.push({id:plan.warmup,dose:EX[plan.warmup].start,tag:'Aufwärmen',hold:0});
  for(let r=1;r<=plan.rounds;r++){
    plan.items.forEach(it=>{const e=EX[it.id];const learn=r===1&&it.learn;
      out.push({id:it.id,dose:learn?learnDose(e,it.dose):it.dose,learn,round:r,rounds:plan.rounds,hold:it.hold||0,tag:`Runde ${r} von ${plan.rounds}`});});
  }
  if(plan.finisher)out.push({id:plan.finisher,dose:EX[plan.finisher].start,tag:'Finisher',hold:0});
  if(plan.cooldown)out.push({id:plan.cooldown,dose:EX[plan.cooldown].start,tag:'Zum Abschluss',hold:0});
  out.forEach((s,i)=>{const nx=out[i+1];if(!nx){s.rest=0;return;}
    const e=EX[s.id],n=EX[nx.id];let r=20;
    if(e.pos!==n.pos)r+=5;
    if((n.eq||[]).some(q=>!(e.eq||[]).includes(q)))r+=10;
    if(nx.round&&s.round&&nx.round!==s.round)r=Math.max(r,45);
    s.rest=r;});
  return out;
}
function stepTime(s){const e=EX[s.id];const k=e.sides?2:1;
  if(e.u==='sec')return s.dose*k+(e.sides?4:0)+3;
  if(s.hold&&state.rhythm)return s.dose*(3.6+s.hold+0.4)+3;
  return s.dose*3.2*k+6;}
function doseText(e,d){return e.u==='sec'?`${d} s`:`${d}`;}
function doseUnit(e){return (e.u==='sec'?'Sekunden':'Wiederholungen')+(e.sides?' pro Seite':'');}
function holdText(e,h){return e.hold&&h?`${e.hold.where} ${h} s halten`:'';}
function doseSpeech(e,s){
  let t=`${s.dose} ${e.u==='sec'?'Sekunden':'Wiederholungen'}${e.sides?' pro Seite':''}`;
  if(e.hold&&s.hold)t+=`, ${e.hold.where} jeweils ${s.hold} ${s.hold===1?'Sekunde':'Sekunden'} halten`;
  return t;
}

/* ---------- Figuren ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
function poseAt(ex,t){
  const [A,B]=ex.poses;const out=[];
  for(let i=0;i<11;i++)out.push([lerp(A[i][0],B[i][0],t),lerp(A[i][1],B[i][1],t)]);
  const mid=(P)=>[(P[1][0]+P[2][0])/2,(P[1][1]+P[2][1])/2];
  const ca=A[11]||mid(A),cb=B[11]||mid(B);out.push([lerp(ca[0],cb[0],t),lerp(ca[1],cb[1],t)]);
  return out;
}
function figHTML(id,anim,extra=''){
  const e=EX[id];
  return `<svg class="fig ${e.front?'front':''}" viewBox="0 -6 120 110" data-ex="${id}" ${anim?'data-anim="1"':''} ${extra} aria-hidden="true">
  <rect class="mat" x="4" y="99" width="112" height="4" rx="2"/><g class="props"></g>
  <path class="band"/><path class="far"/><path class="near"/><circle class="head" r="6"/><path class="kbh"/><circle class="kb" r="0"/></svg>`;
}
function initFig(svg){
  const e=EX[svg.dataset.ex];let p='';
  if(e.table)p+='<path class="prop" d="M60 50H116M110 50V99M100 50V99"/>';
  if(e.chair)p+='<path class="prop" d="M18 81H40M20 81V99M38 81V99M18 81V58"/>';
  if(e.band==='door')p+='<path class="prop" d="M116 -2V99"/><rect x="112" y="35" width="5" height="6" rx="1" fill="var(--muted)"/>';
  svg.querySelector('.props').innerHTML=p;svg._init=1;
}
function drawFig(svg,t){
  const e=EX[svg.dataset.ex];if(!e)return;if(!svg._init)initFig(svg);
  const P=poseAt(e,t);const f=(q)=>q[0].toFixed(1)+' '+q[1].toFixed(1);
  const [h,n,p,k1,f1,k2,f2,e1,a1,e2,a2,c]=P;
  svg.querySelector('.near').setAttribute('d',`M${f(n)} Q${f(c)} ${f(p)} M${f(p)} L${f(k1)} L${f(f1)} M${f(n)} L${f(e1)} L${f(a1)}`);
  svg.querySelector('.far').setAttribute('d',`M${f(p)} L${f(k2)} L${f(f2)} M${f(n)} L${f(e2)} L${f(a2)}`);
  const hd=svg.querySelector('.head');hd.setAttribute('cx',h[0].toFixed(1));hd.setAttribute('cy',h[1].toFixed(1));
  if(e.kb){const x=a1[0],y=a1[1];const kb=svg.querySelector('.kb');kb.setAttribute('r','5.6');
    kb.setAttribute('cx',x.toFixed(1));kb.setAttribute('cy',(y+8).toFixed(1));
    svg.querySelector('.kbh').setAttribute('d',`M${(x-3.6).toFixed(1)} ${(y+4).toFixed(1)} Q${x.toFixed(1)} ${(y-3).toFixed(1)} ${(x+3.6).toFixed(1)} ${(y+4).toFixed(1)}`);}
  if(e.band==='door')svg.querySelector('.band').setAttribute('d',`M${f(a1)} L114 38`);
  if(e.band==='hands')svg.querySelector('.band').setAttribute('d',`M${f(a1)} L${f(a2)}`);
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastFrame=0;
function rhythmT(){const r=ui.run;if(!r||!r.rh)return null;const rh=r.rh;const now=Date.now();
  const k=clamp((now-rh.t0)/(rh.t1-rh.t0||1),0,1);
  return rh.ph==='go'?k:rh.ph==='hold'?1:rh.ph==='back'?1-k:0;}
function frame(now){
  if(now-lastFrame>30){lastFrame=now;
    document.querySelectorAll('svg.fig[data-anim]').forEach(svg=>{
      if(svg.dataset.sync){const t=rhythmT();if(t!==null){drawFig(svg,t);return;}}
      if(reduced){if(!svg._drawn){drawFig(svg,.7);svg._drawn=1;}return;}
      const e=EX[svg.dataset.ex];const per=(svg.dataset.slow?2.2:1)*(e.per||2600);
      const t=(now%per)/per;drawFig(svg,0.5-0.5*Math.cos(2*Math.PI*t));});
  }
  requestAnimationFrame(frame);
}
function drawStatic(){document.querySelectorAll('svg.fig:not([data-anim])').forEach(svg=>drawFig(svg,.75));}

/* ---------- Sprache & Ton ---------- */
let lastSaid='';
function busy(){try{return speechSynthesis.speaking||speechSynthesis.pending;}catch(e){return false;}}
function say(text,opt={}){
  if(!state.voice||!text)return;
  if(opt.optional&&busy())return;
  try{const ss=window.speechSynthesis;if(!ss)return;if(opt.interrupt)ss.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=opt.rate||1.03;
    const v=ss.getVoices().find(v=>v.lang&&v.lang.startsWith('de'));if(v)u.voice=v;ss.speak(u);lastSaid=text;}catch(e){}
}
function hush(){try{speechSynthesis.cancel();}catch(e){}}
let actx=null;
function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d);}catch(e){}}
let noSleep=null,wake=null;
async function keepAwake(on){
  if(!on){try{noSleep&&noSleep.isEnabled&&noSleep.disable();}catch(e){}try{wake&&await wake.release();}catch(e){}wake=null;return;}
  let ok=false;
  try{if(window.NoSleep){noSleep=noSleep||new NoSleep();await noSleep.enable();ok=true;}}catch(e){}
  if(!ok){try{if(navigator.wakeLock){wake=await navigator.wakeLock.request('screen');ok=true;}}catch(e){}}
  if(ok!==ui.awakeOk){ui.awakeOk=ok;if(['player','test','brief'].includes(view))render();}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!wake&&!(noSleep&&noSleep.isEnabled)&&['player','test'].includes(view)&&ui.awakeOk)keepAwake(true);});
function awakeHint(){return ui.awakeOk===false?`<div class="banner"><span><b>Bildschirm kann ausgehen.</b> Dein Gerät erlaubt der App nicht, die Sperre zu verhindern. Tipp: Einstellungen → Anzeige &amp; Helligkeit → Automatische Sperre → Nie, solange du trainierst.</span></div>`:'';}
const secs=n=>n===1?'1 Sekunde':`${n} Sekunden`;

/* ---------- Einstufungstest ---------- */
function startTest(){
  hush();keepAwake(true);
  ui.test={i:0,phase:'intro',choice:'pushup',val:null,results:{},lastEnd:null};
  go('test');
}
function curTest(){return TESTS[ui.test.i];}
function testRun(){
  const T=ui.test,t=curTest();
  T.phase='count';T.end=Date.now()+3500;T.said={};
  say(t.mode==='watch'&&t.key==='balance'?'Auf ein Bein stellen. Bei Los Augen zu.':`${t.title}. Bereit machen.`,{interrupt:true});
  clearInterval(tick);tick=setInterval(testTick,150);render();
}
function testTick(){
  const T=ui.test;if(!T||view!=='test'){clearInterval(tick);return;}
  const t=curTest();const now=Date.now();
  if(T.phase==='count'){const left=Math.ceil((T.end-now)/1000);
    if(left<=3&&left>0&&!T.said['c'+left]){T.said['c'+left]=1;beep(left===1?1040:780);}
    if(now>=T.end){T.phase='run';T.start=now;T.said={};
      if(t.mode==='timer')T.end=now+t.dur*1000;
      say(`Los. ${t.say}`,{interrupt:true});render();}
    return;}
  if(T.phase!=='run')return;
  const el=document.getElementById('clock');
  if(t.mode==='timer'){const left=Math.max(0,Math.ceil((T.end-now)/1000));if(el)el.textContent=fmt(left);
    [30,20,10].forEach(m=>{if(left===m&&!T.said['m'+m]){T.said['m'+m]=1;say(`Noch ${m} Sekunden`,{optional:true});}});
    if(left<=3&&left>0&&!T.said['b'+left]){T.said['b'+left]=1;beep(left===1?1040:780);}
    if(left===0){beep(1300,.3);say('Stopp. Wie viele waren es?',{interrupt:true});T.phase='input';T.val=30;clearInterval(tick);render();}}
  else if(t.mode==='watch'){const s=Math.floor((now-T.start)/1000);if(el)el.textContent=fmt(s);
    if(s>0&&s%10===0&&!T.said['w'+s]){T.said['w'+s]=1;say(secs(s),{optional:true});}}
  else if(t.mode==='max'){const s=Math.floor((now-T.start)/1000);if(el)el.textContent=fmt(s);}
}
function testStop(){
  const T=ui.test,t=curTest();clearInterval(tick);beep(1300,.2);
  if(t.mode==='watch'){T.val=Math.max(1,Math.round((Date.now()-T.start)/1000));say(`${secs(T.val)}. Gut.`,{interrupt:true});}
  else{T.val=t.key==='push'?10:15;say('Gut. Wie viele waren es?',{interrupt:true});}
  T.phase='input';render();
}
function testSave(){
  const T=ui.test,t=curTest();
  T.results[t.key]=t.key==='push'?{n:T.val,variant:T.choice}:t.mode==='choice'?{v:T.val}:{n:T.val};
  T.lastEnd=Date.now();
  if(T.i<TESTS.length-1){T.i++;T.phase='intro';T.val=null;
    const nt=curTest();say(`Nächster Test: ${nt.title}. Erhol dich kurz.`,{interrupt:true});render();window.scrollTo(0,0);}
  else applyTest();
}

      <div class="clock" id="clock">0:00</div><span class="taphint">Irgendwo tippen, wenn du fertig bist</span></button></div>`;}
  /* input */
  const unit=t.mode==='watch'?'Sekunden':'Wiederholungen';
  return `<div class="player">${head}<h1>${t.title}</h1>
    <p class="muted">${t.mode==='watch'?'Gemessene Zeit. Du kannst sie korrigieren.':'Wie viele saubere Wiederholungen hast du geschafft?'}</p>
    <div class="card"><div class="stepper"><button data-act="tdec" aria-label="Weniger">−</button><span class="val" id="tval">${T.val}</span><button data-act="tinc" aria-label="Mehr">+</button></div>
    <p class="muted" style="text-align:center">${unit}</p></div>
    <button class="btn primary block big" data-act="tsave">${T.i<TESTS.length-1?'Speichern und weiter':'Speichern und auswerten'}</button></div>`;
}
function applyTest(){
  const R=ui.test.results;const out=[];const now=Date.now();
  if(state.example)state=Object.assign(freshState(),{profile:state.profile,body:state.body,voice:state.voice});
  state.onboarded=true;
  const items=[];
  if(R.push){const n=R.push.n;
    if(R.push.variant==='pushup'&&n>=5){state.levels.push=1;const d=clamp(Math.round(n*.6),5,25);setEx('pushup',{status:'known',dose:d,clear:2});
      out.push({t:'Liegestütze',v:`${n}`,c:`Training mit Liegestützen, ${d} pro Satz.`});items.push({id:'pushup',sets:1,dose:n});}
    else if(R.push.variant==='kneepush'&&n>=20){state.levels.push=1;setEx('kneepush',{status:'known',dose:20,clear:2});setEx('pushup',{status:'new',dose:5});
      out.push({t:'Knie-Liegestütze',v:`${n}`,c:'Stark! Du steigst direkt bei normalen Liegestützen ein, mit 5 pro Satz.'});items.push({id:'kneepush',sets:1,dose:n});}
    else{state.levels.push=0;const d=clamp(Math.round(n*.6),4,20);setEx('kneepush',{status:'known',dose:d,clear:2});
      out.push({t:R.push.variant==='pushup'?'Liegestütze':'Knie-Liegestütze',v:`${n}`,c:`Start mit Knie-Liegestützen, ${d} pro Satz. Normale Liegestütze kommen, sobald 20 klappen.`});items.push({id:R.push.variant,sets:1,dose:n});}}
  if(R.squat){const n=R.squat.n;const d=clamp(Math.round(n*.5),8,25);setEx('squat',{status:'known',dose:d,clear:2});
    let c=`Training mit ${d} Kniebeugen pro Satz.`;

    out.push({t:'Kniebeugen in 60 s',v:`${n}`,c});items.push({id:'squat',sets:1,dose:n});}
  if(R.plank){const s=R.plank.n;
    if(s<20){state.levels.core=0;out.push({t:'Unterarmstütz',v:`${s} s`,c:'Start mit Dead Bug, der Stütz kommt später dazu.'});}
    else{state.levels.core=s>=75?2:1;const d=clamp(Math.round(s*.6/5)*5,20,75);setEx('plank',{status:'known',dose:d,clear:2});
      out.push({t:'Unterarmstütz',v:`${s} s`,c:`Training mit ${d} Sekunden Stütz.${s>=75?' Seitstütz ist freigeschaltet.':''}`});}
    items.push({id:'plank',sets:1,dose:s});}
  if(R.bridge){const n=R.bridge.n;const d=clamp(Math.round(n*.6),8,25);setEx('bridge',{status:'known',dose:d,clear:2,hold:n>=25?3:2});
    if(n>=30)state.levels.hinge=1;
    out.push({t:'Glute Bridge',v:`${n}`,c:`Training mit ${d} Wiederholungen, oben ${n>=25?3:2} Sekunden halten.${n>=30?' Good Morning ist freigeschaltet.':''}`});items.push({id:'bridge',sets:1,dose:n});}
  if(R.balance){const s=R.balance.n;const d=s<10?6:s<25?8:10;setEx('lunge',{status:'new',dose:d});
    out.push({t:'Einbeinstand, Augen zu',v:`${s} s`,c:s<10?'Gleichgewicht ausbaufähig: Ausfallschritte starten mit 6 pro Seite.':`Ausfallschritte starten mit ${d} pro Seite.`});}
  if(R.reach){const v=R.reach.v;const stiff=['knee','shin'].includes(v);if(stiff)state.flags.mobility=true;
    out.push({t:'Vorbeuge',v:REACHS[v],c:stiff?'Beinrückseite eher fest: Mobilitätsübungen kommen öfter dran.':'Gute Beweglichkeit in der Beinrückseite.'});}
  state.tests.push({id:uid(),date:new Date().toISOString(),results:R});
  state.sessions.push({id:uid(),ts:now,date:new Date().toISOString(),min:10,rpe:7,type:'test',items});
  save();keepAwake(false);ui.plan=null;ui.testOut=out;go('testdone');

}

function replaceInPlan(id){
  const plan=ui.plan;const idx=plan.items.findIndex(i=>i.id===id);if(idx<0)return;
  const p=EX[id].p;const ch=CHAINS[p];let alt=null;
  for(let i=ch.indexOf(id)-1;i>=0;i--){if(available(ch[i])&&allowed(ch[i])&&exState(ch[i]).status==='known'){alt=ch[i];break;}}
  if(!alt){const used=new Set(plan.items.map(i=>i.id));
    alt=Object.keys(state.ex).find(k=>state.ex[k].status==='known'&&!used.has(k)&&available(k)&&allowed(k)&&MAIN.includes(EX[k].p));}
  if(alt){plan.items[idx]={id:alt,dose:exState(alt).dose,sets:plan.rounds,learn:false,hold:holdOf(alt)};}
  else plan.items.splice(idx,1);
  ui.brief.ids=ui.brief.ids.filter(x=>x!==id);
  plan.est=estMin(plan);
  if(!ui.brief.ids.length){startRun();view='player';}
}

/* ---------- Training ---------- */
let tick=null;
function startRun(){
  hush();
  const steps=stepsOf(ui.plan);
  ui.run={steps,i:0,phase:'rest',paused:false,left:0,started:Date.now(),fired:{},events:[],cue:''};
  keepAwake(true);
  const s=steps[0],e=EX[s.id];const R=15;
  ui.run.end=Date.now()+R*1000;
  const main=ui.plan.items.length;
  say(`Los geht's. ${main} Übungen, ${ui.plan.rounds} ${ui.plan.rounds===1?'Runde':'Runden'}, etwa ${ui.plan.est} Minuten.`);
  say(`Zum Aufwärmen: ${e.n}, ${doseSpeech(e,s)}.`);
  say(`${POSSAY[e.pos]||''} ${e.setup}`);
  ui.run.events=timeEvents(R,true);ui.run.setupText=e.setup;
  clearInterval(tick);tick=setInterval(onTick,100);
}
function cur(){return ui.run.steps[ui.run.i];}
function timeEvents(R,rest){
  if(!state.timeCalls)return [];
  const marks=R>20?[30,20,10,5].filter(m=>m<=R-8):[10,5].filter(m=>m<=R-4);
  return marks.map(m=>({at:m,text:m===5?'Noch 5':`Noch ${m} Sekunden`,optional:true}));
}
function startRest(){
  const r=ui.run;const prevIdx=r.i;const prev=r.steps[prevIdx];const R=prev.rest||15;
  r.i++;const s=cur(),e=EX[s.id],pe=EX[prev.id];const N=r.steps.length;
  r.phase='rest';r.end=Date.now()+R*1000;r.fired={};r.rh=null;
  hush();
  say(`Gut. ${R} Sekunden Pause. Das war Übung ${prevIdx+1} von ${N}.`);
  if(s.round&&prev.round&&s.round!==prev.round)say(s.round===s.rounds?'Jetzt kommt die letzte Runde.':`Jetzt Runde ${s.round} von ${s.rounds}.`);
  const label=r.i===N-1?'Letzte Übung':'Als Nächstes';
  say(`${label}: ${e.n}, ${doseSpeech(e,s)}.${s.learn?' Lernsatz, etwas leichter.':''}`);
  const posPart=pe.pos!==e.pos?(POSSAY[e.pos]+' '):'';
  const eqPart=(e.eq||[]).filter(q=>!(pe.eq||[]).includes(q)).map(q=>EQSAY[q]).join(' ');
  const setupText=`${posPart}${eqPart?eqPart+' ':''}${e.setup}`.trim();
  r.setupText=setupText;
  const ev=timeEvents(R,true);
  if(R>=18){const at=Math.min(13,R-6);ev.push({at,text:`In Position. ${setupText}`,optional:false});
    for(let k=ev.length-1;k>=0;k--){if(ev[k].optional&&ev[k].at>at-3&&ev[k].at<=at+1)ev.splice(k,1);}}
  else say(setupText);
  r.events=ev;
  render();
}
function beginWork(){
  const r=ui.run,s=cur(),e=EX[s.id];
  r.phase='work';r.fired={};r.side=1;r.events=[];r.rh=null;
  r.cue=e.cues[e.key||0];
  if(e.u==='sec'){r.end=Date.now()+s.dose*1000;say(`Los. ${r.cue}.`,{interrupt:true});r.events=timeEvents(s.dose,false);}
  else if(s.hold&&state.rhythm&&e.rh){r.end=0;say('Los.',{interrupt:true});
    r.rh={rep:1,ph:'pre',t0:Date.now(),t1:Date.now()+900,said:{}};}
  else{r.end=0;say(`Los. ${r.cue}.`,{interrupt:true});}
  render();
}
function rhStep(){
  const r=ui.run,s=cur(),e=EX[s.id],rh=r.rh;const now=Date.now();
  if(now<rh.t1){
    if(rh.ph==='hold'){const el=Math.floor((now-rh.t0)/1000);const left=s.hold-el;
      if(el>0&&left>0&&!rh.said['h'+rh.rep+'_'+el]){rh.said['h'+rh.rep+'_'+el]=1;say(String(left),{interrupt:true,rate:1.15});}}
    return;}
  const setPh=(ph,dur,word)=>{rh.ph=ph;rh.t0=now;rh.t1=now+dur;if(word)say(word,{interrupt:true,rate:1.1});updateRh();};
  if(rh.ph==='pre'){setPh('go',1600,s.dose===1?`Letzte. ${e.rh[0]}`:e.rh[0]);return;}
  if(rh.ph==='go'){setPh('hold',s.hold*1000,'Halten');return;}
  if(rh.ph==='hold'){setPh('back',2000,e.rh[1]);return;}
  if(rh.ph==='back'){
    if(rh.rep>=s.dose){beep(1300,.25);r.rh=null;startNext();return;}
    rh.rep++;const last=rh.rep===s.dose;
    rh.ph='gap';rh.t0=now;rh.t1=now+400;updateRh();
    rh.nextWord=last?`Letzte. ${e.rh[0]}`:(rh.rep===Math.ceil(s.dose/2)&&s.dose>=8?`Halbzeit. ${e.rh[0]}`:e.rh[0]);return;}
  if(rh.ph==='gap'){setPh('go',1600,rh.nextWord);return;}
}
function updateRh(){const r=ui.run,rh=r.rh;if(!rh)return;const s=cur(),e=EX[s.id];
  const a=document.getElementById('rhrep');if(a)a.textContent=`${rh.rep}`;
  const b=document.getElementById('rhph');if(b)b.textContent=rh.ph==='go'?e.rh[0]:rh.ph==='hold'?'Halten':rh.ph==='back'?e.rh[1]:'';}
function startNext(){const r=ui.run;if(r.i>=r.steps.length-1){finishRun();return;}startRest();}
function finishRun(){clearInterval(tick);keepAwake(false);
  const r=ui.run;const min=Math.max(1,Math.round((Date.now()-r.started)/60000));
  say('Geschafft. Das war dein Training. Gut gemacht.',{interrupt:true});
  const ids=[...ui.plan.items.map(i=>i.id)];if(ui.plan.finisher)ids.push(ui.plan.finisher);
  const items={};ids.forEach(id=>{const st=exState(id);items[id]={rating:'ok',form:'clean',pain:false,clarity:st.status!=='known'&&EX[id].p!=='cardio'?'clear':null};});
  ui.fb={ids,items,rpe:6,min};ui.run=null;go('feedback');}
function onTick(){
  const r=ui.run;if(!r||r.paused||view!=='player')return;
  const now=Date.now();
  if(r.phase==='work'&&r.rh){rhStep();return;}
  if(r.phase==='work'&&!r.end)return;
  if(r.switching){if(now<r.switching)return;r.switching=0;r.end=now+cur().dose*1000;r.fired={};say('Und los.',{interrupt:true});render();return;}
  const left=Math.max(0,Math.ceil((r.end-now)/1000));
  const el=document.getElementById('clock');if(el)el.textContent=fmt(left);
  r.events.forEach((ev,k)=>{if(!r.fired['e'+k]&&left<=ev.at&&left>0){r.fired['e'+k]=1;say(ev.text,{optional:ev.optional});}});
  if(left<=3&&left>0&&!r.fired['b'+left]){r.fired['b'+left]=1;beep(left===1?1040:780);}
  if(left===0){
    if(r.phase==='rest'){beginWork();return;}
    const e=EX[cur().id];
    if(e.sides&&r.side===1){r.side=2;beep(1300,.2);say('Seite wechseln.',{interrupt:true});r.switching=now+4000;render();return;}
    beep(1300,.25);startNext();
  }
}

function applyFeedback(){
  const fb=ui.fb;const msgs=[];
  const items=fb.ids.map(id=>{const it=ui.plan.items.find(i=>i.id===id);return {id,sets:it?it.sets:1,dose:it?it.dose:EX[id].start,hold:it?it.hold:0,...fb.items[id]};});
  if(ui.plan.warmup)items.unshift({id:ui.plan.warmup,sets:1,dose:EX[ui.plan.warmup].start,rating:'ok'});
  items.forEach(it=>{
    const e=EX[it.id];if(e.p==='mobility')return;
    const st=exState(it.id);const old=st.dose;let dose=old;let note='';let kind='same';
    const oldHold=holdOf(it.id);let hold=oldHold;
    const bump=e.u==='sec'?5:1;
    if(it.pain){note='Schmerz notiert: keine Steigerung. Hält es an, lieber die leichtere Variante oder ärztlich abklären.';kind='bad';}
    else if(it.form==='sloppy'&&it.rating!=='fail'){note='Erst Technik festigen: alles bleibt gleich.';kind='warn';}
    else if(it.rating==='easy'){if(e.hold&&hold<e.hold.max)hold++;else dose=old+(e.step||bump);kind='good';}
    else if(it.rating==='ok'){dose=old+bump;kind='good';}
    else if(it.rating==='hard'){note='Bleibt gleich, bis es sich gut anfühlt.';kind='warn';}
    else if(it.rating==='fail'){dose=Math.max(e.u==='sec'?10:3,old-(e.step||bump));if(e.hold&&hold>e.hold.start)hold--;kind='bad';}
    let status=st.status,clear=st.clear||0;
    if(it.clarity){if(it.clarity==='clear'){clear++;status=clear>=2?'known':'learning';}
      else{clear=0;status='learning';}}
    else if(status==='new')status='learning';
    const patch={dose,status,clear,hold};
    const ch=CHAINS[e.p];const lv=ch?ch.indexOf(it.id):-1;
    if(ch&&lv>=0&&dose>=e.max&&(it.rating==='easy'||it.rating==='ok')&&!it.pain&&lv<ch.length-1){
      const nx=ch[lv+1];patch.dose=e.max;
      if(available(nx)&&allowed(nx)){state.levels[e.p]=Math.max(state.levels[e.p]||0,lv+1);note=`Maximum erreicht. Nächste Stufe freigeschaltet: ${EX[nx].n}. Du lernst sie vor dem nächsten Training kennen.`;}
      else{note=`Maximum erreicht. Die nächste Stufe (${EX[nx].n}) braucht: ${(EX[nx].eq||[]).map(q=>EQN[q]).join(', ')||'grünes Licht bei deinen Beschwerden'}.`;if((EX[nx].eq||[]).includes('kb'))state.flags.needKb=true;}
    }
    if(ch&&lv>0&&it.rating==='fail'&&dose<e.start*.7){state.levels[e.p]=lv-1;note=`Nächstes Mal wieder ${EX[ch[lv-1]].n}, bis die Kraft da ist.`;}
    setEx(it.id,patch);
    let dtext=patch.dose!==old?`${doseText(e,old)} → ${doseText(e,patch.dose)}${e.u==='sec'?'':' Wdh.'}`:`bleibt bei ${doseText(e,old)}${e.u==='sec'?'':' Wdh.'}`;
    if(e.hold&&hold!==oldHold)dtext+=` · Halten ${oldHold} → ${hold} s`;
    const ctext=it.clarity?(status==='known'?' Bewegung sitzt: gilt jetzt als sicher.':it.clarity==='clear'?' Noch einmal klar, dann gilt sie als sicher.':' Einweisung kommt beim nächsten Mal wieder.'):'';
    msgs.push({kind,title:e.n,line:dtext,note:(note+ctext).trim()});
  });
  const t=Date.now();
  state.sessions.push({id:uid(),ts:t,date:new Date(t).toISOString(),min:fb.min,rpe:fb.rpe,
    items:items.map(({id,sets,dose,hold,rating,form,pain,clarity})=>({id,sets,dose,hold,rating,form,pain,clarity}))});

}

  const P=ui.importPending;
  return `<section class="card" id="daten"><h3>Daten sichern</h3>
    <p class="small muted">Deine Daten liegen nur auf diesem Gerät. Wenn du das App-Symbol löschst, sind sie weg. Eine Sicherung kannst du z. B. in iCloud Drive ablegen und auf dem iPad wieder laden.</p>
    <p class="small"><b>Letzte Sicherung:</b> ${lb?`${lb.toLocaleDateString('de-DE')} (${ago===0?'heute':ago===1?'gestern':`vor ${ago} Tagen`})`:'noch keine'}</p>
    ${P?`<div class="why"><b>Sicherung gefunden:</b> ${P.info}. Sie ersetzt die Daten auf diesem Gerät.</div>
      <div class="row"><button class="btn grow" data-act="importno">Abbrechen</button><button class="btn primary grow" data-act="importyes">Übernehmen</button></div>`
    :`<div class="row wrap"><button class="btn primary grow" data-act="backup">Sicherung erstellen</button>
      <label class="btn grow" style="text-align:center;cursor:pointer">Sicherung laden<input type="file" id="importfile" accept="application/json,.json" hidden></label></div>
      <div class="row wrap"><button class="btn grow" data-act="copydata">Daten kopieren</button><button class="btn grow" data-act="pasteopen">Daten einfügen</button></div>`}
    ${ui.pasteOpen&&!P?`<div class="field"><label for="pastebox">Kopierte Daten hier einfügen</label><textarea id="pastebox" placeholder="Mit „Daten kopieren“ in der alten Version kopiert"></textarea></div>
      <div class="row"><button class="btn grow" data-act="pasteno">Abbrechen</button><button class="btn primary grow" data-act="pastego">Prüfen</button></div>`:''}
    ${ui.copyBox?`<div class="field"><label for="copybox">Automatisches Kopieren ging nicht. Text markieren und kopieren:</label><textarea id="copybox" readonly>${esc(ui.copyBox)}</textarea></div>`:''}
    ${ui.dataMsg?`<p class="small" style="color:var(--good)">${esc(ui.dataMsg)}</p>`:''}
    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:4px 0">
    ${ui.resetAsk?`<p class="small"><b>Wirklich alles löschen?</b> Trainings, Tests und Übungsstände gehen verloren, Profil und Geräte bleiben.</p>
      <div class="row"><button class="btn grow" data-act="resetno">Abbrechen</button><button class="btn primary grow" data-act="resetyes">Löschen</button></div>`
      :`<div class="row wrap"><button class="btn grow" data-act="resetask">Verlauf löschen</button>${state.example?'':'<button class="btn grow" data-act="seed">Beispieldaten ansehen</button>'}</div>`}
    <p class="small muted">Version ${APP_VERSION}${ui.persisted===true?' · Speicher dauerhaft geschützt':ui.persisted===false?' · Speicher nicht dauerhaft geschützt':''}${isStandalone()?' · als App gestartet':''}</p>
  </section>`;
}
function bodyStats(){
  const B=state.body;const ms=B.measures;const m=ms[ms.length-1];const out=[];if(!m||!B.height)return out;
  const h=B.height/100;
  if(m.weight){const bmi=m.weight/(h*h);const c=bmi<18.5?['Untergewicht','warn']:bmi<25?['Normalgewicht','good']:bmi<30?['Übergewicht','warn']:['Adipositas','bad'];
    out.push({v:bmi.toFixed(1).replace('.',','),t:'BMI',c:`${c[0]} (18,5–24,9 gilt als normal). Unterscheidet nicht zwischen Muskeln und Fett.`,k:c[1]});}
  if(m.waist){const r=m.waist/B.height;const c=r<0.5?['günstig','good']:r<0.6?['erhöht','warn']:['deutlich erhöht','bad'];
    out.push({v:r.toFixed(2).replace('.',','),t:'Taille-zu-Größe',c:`${c[0]}. Unter 0,5 gilt als günstig${B.age&&B.age>=50?' (ab 50 bis etwa 0,6)':''}. Sagt mehr über Bauchfett aus als der BMI.`,k:c[1]});}
  return out;
}
function bodyStatsHTML(){const b=bodyStats();if(!b.length)return '';
  const col={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)'};
  return `<table class="res">${b.map(x=>`<tr><td class="v num" style="color:${col[x.k]}">${x.v}</td><td><b>${x.t}</b><br><span class="small">${esc(x.c)}</span></td></tr>`).join('')}</table>
  <p class="small muted">Grobe Orientierung, keine medizinische Bewertung.</p>`;}
function testRows(R){
  const rows=[];
  if(R.push)rows.push([`${R.push.n}`,R.push.variant==='kneepush'?'Knie-Liegestütze':'Liegestütze']);
  if(R.squat)rows.push([`${R.squat.n}`,'Kniebeugen in 60 s']);
  if(R.plank)rows.push([`${R.plank.n} s`,'Unterarmstütz']);
  if(R.bridge)rows.push([`${R.bridge.n}`,'Glute Bridge']);
  if(R.balance)rows.push([`${R.balance.n} s`,'Einbeinstand, Augen zu']);
  if(R.reach)rows.push([REACHS[R.reach.v],`Vorbeuge: ${REACHN[R.reach.v]}`]);
  return rows.map(([v,t])=>`<tr><td class="v num">${esc(v)}</td><td>${esc(t)}</td></tr>`).join('');
}

/* ---------- Geräte ---------- */
function vGear(){
  const P=state.profile;const r=recs();
  const sw=(k,l,sub)=>`<label class="switch"><span class="stack" style="gap:0"><b>${l}</b>${sub?`<span class="small muted">${sub}</span>`:''}</span><input type="checkbox" id="eq-${k}" data-act="eq" data-v="${k}" ${P[k]?'checked':''}></label>`;
  const weights=[4,6,8,10,12,14,16,20,24];
  return `<header class="stack" style="gap:4px"><span class="eyebrow">Ausrüstung</span><h1>Geräte</h1></header>
  <section class="card"><h3>Was du zu Hause hast</h3>
    <div><label class="switch"><span class="stack" style="gap:0"><b>Yogamatte</b><span class="small muted">Immer dabei, reicht für alle Grundübungen</span></span><input type="checkbox" checked disabled></label>
    ${sw('chair','Stuhl oder Sofa','Für Bulgarische Kniebeugen')}
    ${sw('table','Stabiler Tisch','Für Tisch-Rudern')}
    ${sw('band','Widerstandsbänder','Für Rudern und Pull-Aparts')}
    ${sw('pullup','Klimmzugstange','Übungen folgen in einer späteren Version')}</div>
    <div class="stack" style="gap:8px"><b>Kettlebells</b><div class="row wrap">${weights.map(w=>`<button class="chip num" data-act="kb" data-v="${w}" aria-pressed="${P.kb.includes(w)}">${w} kg</button>`).join('')}</div></div>
  </section>
  ${r.length?r.map(x=>`<section class="card"><div class="row between"><div class="stack" style="gap:2px"><span class="eyebrow">Empfehlung</span><h2>${x.title}</h2></div>
      <div style="text-align:right"><div class="weight num">${x.big}</div><span class="small muted">${x.price}</span></div></div>
    <div class="why"><b>Warum:</b> ${esc(x.why)}</div>
    <p class="small">${esc(x.what)}</p>${x.test?`<p class="small">${esc(x.test)}</p>`:''}
    <p class="small muted">${esc(x.alt)}</p>
    <div class="row wrap"><button class="btn primary grow" data-act="have" data-v="${x.key}">Habe ich jetzt</button><button class="btn grow" data-act="dismiss" data-v="${x.key}">Nicht mehr vorschlagen</button></div></section>`).join('')
  :`<section class="card"><h3>Keine Empfehlung</h3><p class="small muted">Empfehlungen erscheinen frühestens nach 3 Wochen und 6 Trainings, und nur wenn deine Daten eine Lücke zeigen.</p></section>`}
  <section class="card"><h3>Sinnvolle Reihenfolge für zu Hause</h3>
    <ol class="clean" style="padding-left:1.3em"><li><b>Widerstandsbänder:</b> günstig, leise, kein Platzbedarf, schließen die Lücke beim Ziehen</li>
    <li><b>Eine Kettlebell:</b> Beine, Hüfte, Rumpf und Kondition mit einem Gerät</li>
    <li><b>Klimmzugstange:</b> sehr effektiv, braucht einen passenden Türrahmen</li>
    <li><b>Zweite Kettlebell</b> oder verstellbare Kurzhanteln</li></ol></section>`;
}

/* ---------- Sichern & Laden ---------- */
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
function backupText(){return JSON.stringify({app:'mattenzeit',version:APP_VERSION,exported:new Date().toISOString(),state});}
function markBackup(msg){state.lastBackup=new Date().toISOString();save();ui.dataMsg=msg;render();}
function exportData(){
  const d=new Date();const name=`mattenzeit-sicherung-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const text=backupText();
  let file=null;try{file=new File([text],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Mattenzeit-Sicherung'}).then(()=>markBackup('Sicherung erstellt.')).catch(()=>{});
    return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();markBackup('Sicherung heruntergeladen.');}
  catch(e){ui.copyBox=text;render();}
}
function parseImport(text){
  ui.dataMsg='';
  try{let o=JSON.parse(text.trim());const st=o&&o.state?o.state:o;
    if(!st||!(st.v===1||st.v===2)||!Array.isArray(st.sessions))throw new Error('format');
    const n=st.sessions.filter(x=>!x.example).length;const t=(st.tests||[]).length;
    const when=o.exported?` vom ${new Date(o.exported).toLocaleDateString('de-DE')}`:'';
    ui.importPending={st,info:`Stand${when}, ${n} ${n===1?'Training':'Trainings'}${t?`, ${t} ${t===1?'Test':'Tests'}`:''}${st.body&&st.body.name?`, Profil „${esc(st.body.name)}“`:''}`};
  }catch(e){ui.importPending=null;ui.dataMsg='';ui.importError=true;}
  ui.pasteOpen=false;render();
  if(ui.importError){ui.importError=false;const el=document.getElementById('daten');
    if(el)el.insertAdjacentHTML('beforeend','<p class="small" style="color:var(--bad)">Das ist keine gültige Mattenzeit-Sicherung. Bitte die ganze Datei oder den ganzen kopierten Text verwenden.</p>');}
}
function copyData(){
  const text=backupText();ui.copyBox=null;
  try{navigator.clipboard.writeText(text).then(()=>{ui.dataMsg='Daten kopiert. In der neuen App unter Verlauf → „Daten einfügen“.';render();},()=>{ui.copyBox=text;render();});}
  catch(e){ui.copyBox=text;render();}
}

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
  if(a==='closedetail'&&ev.target.closest('[data-stop]')&&!ev.target.closest('.iconbtn'))return;
  if(t.tagName==='INPUT')return;
  const H={
    tab(){if(view==='player')return;if(view==='brief')keepAwake(false);if(view==='onboard')bindInputs();ui.resetAsk=false;ui.measure=false;go(v);},
    minutes(){ui.minutes=+v;ui.plan=null;render();},
    energy(){state.energy=v;save();ui.plan=null;render();},
    quiet(){state.profile.quiet=!state.profile.quiet;save();ui.plan=null;render();},
    timecalls(){state.timeCalls=!state.timeCalls;save();render();},
    rhythm(){state.rhythm=!state.rhythm;save();ui.plan=null;render();},
    detail(){ui.detail=v;render();},
    closedetail(){ui.detail=null;render();},
    filter(){ui.filter=v;render();},
    start(){startFlow();},
    slow(){ui.brief.slow=ui.brief.slow===v?null:v;render();
      if(ui.brief.slow===v){const e=EX[v];hush();say(`${e.n}. Ausgangsposition: ${e.setup} ${e.cues.join('. ')}.`);}},
    okbrief(){ui.brief.ok[v]=!ui.brief.ok[v];render();},
    replace(){replaceInPlan(v);render();},
    run(){startRun();go('player');},
    done(){const r=ui.run;if(r.paused)r.paused=false;r.rh=null;beep(1300,.2);startNext();},
    skiprest(){beginWork();},
    plus10(){ui.run.end+=10000;onTick();},
    pause(){const r=ui.run;if(r.paused){r.end=Date.now()+r.left*1000;r.paused=false;}else{r.left=Math.max(0,Math.ceil((r.end-Date.now())/1000));r.paused=true;}render();},
    voice(){state.voice=!state.voice;save();if(!state.voice)hush();render();},
    quit(){ui.quit=true;render();},
    quitno(){ui.quit=false;render();},
    quityes(){ui.quit=false;hush();finishRun();},
    rate(){ui.fb.items[id].rating=v;render();},
    clarity(){ui.fb.items[id].clarity=v;render();},
    form(){const f=ui.fb.items[id];f.form=f.form==='sloppy'?'clean':'sloppy';render();},
    pain(){const f=ui.fb.items[id];f.pain=!f.pain;render();},
    savefb(){applyFeedback();},
    kb(){if(view==='onboard')bindInputs();const w=+v;const k=state.profile.kb;const i=k.indexOf(w);if(i>=0)k.splice(i,1);else k.push(w);k.sort((x,y)=>x-y);save();ui.plan=null;render();},
    eqchip(){bindInputs();state.profile[v]=!state.profile[v];save();ui.plan=null;render();},
    have(){if(v==='kb'){if(!state.profile.kb.length)state.profile.kb.push(kbRec().main);if(state.levels.squat<1)state.levels.squat=1;if(state.levels.hinge<2)state.levels.hinge=2;}
      if(v==='band'){state.profile.band=true;if(state.levels.pull<1)state.levels.pull=1;}save();ui.plan=null;render();},
    dismiss(){state.dismissed[v]=true;save();render();},
    resetask(){ui.resetAsk=true;render();},
    resetno(){ui.resetAsk=false;render();},
    resetyes(){const keep={profile:state.profile,body:Object.assign({},state.body,{measures:[]}),voice:state.voice,onboarded:true};
      state=Object.assign(freshState(),keep);save();ui.resetAsk=false;ui.plan=null;render();},
    seed(){const prof=state.profile;const body=state.body;state=seedState();state.profile=prof;state.body=Object.assign(body,{measures:[]});save();ui.plan=null;go('today');},
    /* Einstieg */
    goal(){bindInputs();let g=goals().slice();const i=g.indexOf(v);
      if(i>=0){if(g.length>1)g.splice(i,1);}
      else if(v==='fitter')g=['fitter'];
      else{g=g.filter(x=>x!=='fitter');if(g.length>=3)g.pop();g.push(v);}
      state.body.goals=g;delete state.body.goal;save();ui.plan=null;render();},
    freq(){bindInputs();state.body.freq=+v;save();render();},
    limit(){const L=state.body.limits;const i=L.indexOf(v);if(i>=0)L.splice(i,1);else L.push(v);save();ui.plan=null;render();},
    obnext(){bindInputs();if(ui.ob.step===2){commitMeasure(ui.ob.m);ui.ob.m=null;}ui.ob.step=Math.min(4,ui.ob.step+1);save();render();window.scrollTo(0,0);},
    obback(){bindInputs();ui.ob.step=Math.max(1,ui.ob.step-1);render();window.scrollTo(0,0);},
    obskip(){finishOnboard();go('today');},
    obexample(){bindInputs();const prof=state.profile,body=state.body;state=seedState();state.profile=prof;state.body=body;save();ui.plan=null;go('today');},
    obrestart(){ui.ob={step:1};go('onboard');},
    /* Test */
    teststart(){if(view==='onboard')bindInputs();startTest();},
    testrun(){testRun();},
    teststop(){testStop();},
    tchoice(){ui.test.choice=v;render();},
    tpick(){ui.test.val=v;testSave();},
    tdec(){ui.test.val=Math.max(0,(ui.test.val||0)-1);document.getElementById('tval').textContent=ui.test.val;},
    tinc(){ui.test.val=(ui.test.val||0)+1;document.getElementById('tval').textContent=ui.test.val;},
    tsave(){testSave();},
    testquit(){clearInterval(tick);hush();keepAwake(false);ui.test=null;go(state.onboarded?'today':'onboard');},
    /* Daten */
    backup(){exportData();},
    copydata(){copyData();},
    pasteopen(){ui.pasteOpen=true;ui.copyBox=null;render();const t=document.getElementById('pastebox');if(t)t.focus();},
    pasteno(){ui.pasteOpen=false;render();},
    pastego(){parseImport(document.getElementById('pastebox').value);},
    importno(){ui.importPending=null;render();},
    importyes(){const st=migrate(ui.importPending.st);state=st;state.onboarded=true;save();ui.importPending=null;ui.plan=null;ui.dataMsg='Daten übernommen.';render();},
    /* Messen */
    measure(){ui.measure=true;render();},
    measureno(){ui.measure=false;render();},
    measuresave(){const w=document.getElementById('m-weight').value.trim(),c=document.getElementById('m-waist').value.trim();
      commitMeasure({weight:w===''?null:+w.replace(',','.'),waist:c===''?null:+c.replace(',','.')});save();ui.measure=false;render();}
  };
  if(H[a]){ev.preventDefault();H[a]();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='importfile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>parseImport(String(r.result));r.readAsText(t.files[0]);return;}
  if(t.dataset&&t.dataset.act==='eq'){state.profile[t.dataset.v]=t.checked;save();ui.plan=null;render();}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='rpe'){ui.fb.rpe=+ev.target.value;const o=document.getElementById('rpev');if(o)o.textContent=ui.fb.rpe+'/10';}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.detail){ui.detail=null;render();}});

render();requestAnimationFrame(frame);

/* ---------- Installierbare App ---------- */
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p?p:navigator.storage.persist()).then(p=>{ui.persisted=p;if(view==='progress')render();}).catch(()=>{});}}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=w=>{ui.waiting=w;render();};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w);});});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload();});
  document.getElementById('update-btn').addEventListener('click',()=>{if(ui.waiting)ui.waiting.postMessage({type:'SKIP_WAITING'});});
}
</script>
